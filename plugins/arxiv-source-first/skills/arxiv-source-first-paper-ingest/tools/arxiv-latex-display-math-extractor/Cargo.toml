[package]
name = "arxiv-latex-display-math-extractor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arxiv-latex-display-math-extractor"
path = "src/main.rs"

[dependencies]
pulldown-latex = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
